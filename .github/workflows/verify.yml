name: Verify desktop
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:desktop
      - run: npm run package:win
      - name: Exercise packaged executable
        shell: pwsh
        run: |
          $env:BAUDLOOM_EXECUTABLE = Join-Path $PWD 'artifacts/Baudloom-win32-x64/Baudloom.exe'
          node tests/desktop-smoke.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: baudloom-windows-x64
          path: artifacts/Baudloom-*-win-x64.exe
          if-no-files-found: error
          retention-days: 7
